name: ECW CI Job Active Session

# Session-trigger flow, part 2 of 2 (demo).
#
# This workflow does no hardware work. It exists to prove that ECW woke
# GitHub the moment the booking made by ci-job-smoke.yml became active:
# ECW fires it via the workflow_dispatch REST API and passes the booking
# context as inputs. Replace the single job below with real flash/test/
# release steps when you have hardware.
#
# NOTE: for the workflow_dispatch REST API to accept the call, this file
# must exist on the repository's default branch.

on:
  workflow_dispatch:
    inputs:
      booking_id:
        description: ECW booking id (injected by ECW)
        required: true
      board_id:
        description: Board id (injected by ECW)
        required: false
        default: ""
      board_type_id:
        description: Board type id (injected by ECW)
        required: false
        default: ""
      board_name:
        description: Board name (injected by ECW)
        required: false
        default: ""
      starts_at:
        description: Session start, ISO-8601 (injected by ECW)
        required: false
        default: ""
      ends_at:
        description: Session end, ISO-8601 (injected by ECW)
        required: false
        default: ""
      run_id:
        description: ci-job-smoke.yml run id that reserved the board
        required: false
        default: ""
      sha:
        description: Commit the smoke run built from
        required: false
        default: ""
      backend_url:
        description: ECW backend base URL
        required: false
        default: ""

jobs:
  session-active:
    name: Session active (triggered by ECW)
    runs-on: self-hosted
    steps:
      - name: Show the booking context ECW passed
        run: |
          echo "ECW activated the booked session and triggered this workflow."
          echo
          echo "  booking_id    = ${{ inputs.booking_id }}"
          echo "  board_id      = ${{ inputs.board_id }}"
          echo "  board_type_id = ${{ inputs.board_type_id }}"
          echo "  board_name    = ${{ inputs.board_name }}"
          echo "  starts_at     = ${{ inputs.starts_at }}"
          echo "  ends_at       = ${{ inputs.ends_at }}"
          echo "  run_id        = ${{ inputs.run_id }}"
          echo "  sha           = ${{ inputs.sha }}"
          echo "  backend_url   = ${{ inputs.backend_url }}"
