name: ECW CI Job Smoke

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      backend_url:
        description: ECW backend base URL reachable from the self-hosted runner
        required: true
        default: http://localhost:8002
      board_search:
        description: Board name text to search before auto-booking
        required: true
        default: VIRTUAL-CI-SERIAL-CAMERA
      booking_wait_timeout_seconds:
        description: >-
          Maximum seconds to wait for the auto booking to become active.
          Auto-booking searches up to 24h ahead for a free slot (see
          autoBookBoard's search_until), so this defaults high enough to
          cover that whole window rather than give up early.
        required: true
        default: "86400"
      job_wait_timeout_seconds:
        description: Maximum seconds to wait for the CI jobs to finish
        required: true
        default: "180"

env:
  ECW_BACKEND_URL: ${{ inputs.backend_url || 'http://localhost:8002' }}
  BOARD_SEARCH: ${{ inputs.board_search || 'VIRTUAL-CI-SERIAL-CAMERA' }}
  BOOKING_WAIT_TIMEOUT_SECONDS: ${{ inputs.booking_wait_timeout_seconds || '86400' }}
  JOB_WAIT_TIMEOUT_SECONDS: ${{ inputs.job_wait_timeout_seconds || '180' }}

jobs:
  build:
    name: Build
    runs-on: self-hosted
    steps:
      - name: No-op
        run: |
          echo "build - nothing to do yet"

  reserve:
    name: Reserve
    runs-on: self-hosted
    needs: build
    outputs:
      booking_id: ${{ steps.booking.outputs.booking_id }}
      board_name: ${{ steps.board.outputs.board_name }}

    env:
      ECW_API_KEY: ${{ secrets.ECW_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          set -euo pipefail

          if [ -z "${ECW_API_KEY}" ]; then
            echo "Missing ECW_API_KEY repository secret."
            exit 1
          fi

      - name: Check backend health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "${ECW_BACKEND_URL%/}/docs" \
            --output /dev/null

      - name: Select board type
        id: board
        run: python3 .github/scripts/select_board.py

      - name: Find or create booking
        id: booking
        env:
          ECW_BOARD_NAME: ${{ steps.board.outputs.board_name }}
        run: python3 .github/scripts/find_or_create_booking.py

      - name: Upload reserve artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecw-ci-reserve-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

  wait:
    name: Wait
    runs-on: self-hosted
    needs: reserve
    # GitHub's own job timeout defaults to 360 minutes and would kill this
    # job regardless of BOOKING_WAIT_TIMEOUT_SECONDS. Auto-booking only
    # searches up to 24h ahead, so give this a matching ceiling.
    timeout-minutes: 1440

    env:
      ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
      ECW_BOOKING_ID: ${{ needs.reserve.outputs.booking_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for booking to become active
        run: python3 .github/scripts/wait_for_booking.py

  upload:
    name: Upload
    runs-on: self-hosted
    needs: wait
    steps:
      - name: No-op
        run: |
          echo "upload - nothing to do yet"

  test:
    name: Test
    runs-on: self-hosted
    needs: [reserve, upload]

    env:
      ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
      ECW_BOOKING_ID: ${{ needs.reserve.outputs.booking_id }}
      ECW_BOARD_NAME: ${{ needs.reserve.outputs.board_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create wait, serial, and camera CI jobs
        run: python3 .github/scripts/create_jobs.py

      - name: Poll CI jobs and report results
        run: python3 .github/scripts/poll_jobs.py

      - name: Download CI job artifact bundles
        if: always()
        run: python3 .github/scripts/download_artifacts.py

  collect:
    name: Collect
    runs-on: self-hosted
    needs: test
    if: always()
    steps:
      - name: Upload CI job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecw-ci-job-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

  release:
    name: Release
    runs-on: self-hosted
    needs: [reserve, collect]
    if: always()

    env:
      ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
      ECW_BOOKING_ID: ${{ needs.reserve.outputs.booking_id }}

    steps:
      - name: Cancel booking
        if: always()
        run: |
          set -euo pipefail

          if [ -z "${ECW_BOOKING_ID:-}" ] || [ -z "${ECW_API_KEY:-}" ]; then
            echo "No booking/API key available; skipping reservation cleanup."
            exit 0
          fi

          curl --fail --silent --show-error \
            --header "X-API-Key: ${ECW_API_KEY}" \
            --get \
            --data-urlencode "booking_id=${ECW_BOOKING_ID}" \
            "${ECW_BACKEND_URL%/}/cancel-booking"
