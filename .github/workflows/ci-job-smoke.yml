name: ECW CI Job Smoke

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      backend_url:
        description: ECW backend base URL reachable from the self-hosted runner
        required: true
        default: http://localhost:8002
      board_search:
        description: Board name text to search before auto-booking
        required: true
        default: VIRTUAL-CI-SERIAL-CAMERA
      booking_wait_timeout_seconds:
        description: Maximum seconds to wait for the auto booking to become active
        required: true
        default: "180"
      job_wait_timeout_seconds:
        description: Maximum seconds to wait for the CI jobs to finish
        required: true
        default: "180"

env:
  ECW_BACKEND_URL: ${{ inputs.backend_url || 'http://localhost:8002' }}
  BOARD_SEARCH: ${{ inputs.board_search || 'VIRTUAL-CI-SERIAL-CAMERA' }}
  BOOKING_WAIT_TIMEOUT_SECONDS: ${{ inputs.booking_wait_timeout_seconds || '180' }}
  JOB_WAIT_TIMEOUT_SECONDS: ${{ inputs.job_wait_timeout_seconds || '180' }}

jobs:
  reserve:
    name: "1. Reserve: auto-book a board"
    runs-on: self-hosted
    outputs:
      booking_id: ${{ steps.booking.outputs.booking_id }}
      board_name: ${{ steps.board.outputs.board_name }}

    env:
      ECW_EMAIL: ${{ secrets.ECW_EMAIL }}
      ECW_PASSWORD: ${{ secrets.ECW_PASSWORD }}

    steps:
      - name: Check required secrets
        run: |
          set -euo pipefail

          if [ -z "${ECW_EMAIL}" ] || [ -z "${ECW_PASSWORD}" ]; then
            echo "Missing ECW_EMAIL or ECW_PASSWORD repository secret."
            exit 1
          fi

      - name: Check backend health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "${ECW_BACKEND_URL%/}/docs" \
            --output /dev/null

      - name: Login and store token
        run: |
          set -euo pipefail

          login_response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"${ECW_EMAIL}\",\"password\":\"${ECW_PASSWORD}\"}" \
            "${ECW_BACKEND_URL%/}/auth/jwt/login")"

          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))' <<<"${login_response}")"

          if [ -z "${token}" ]; then
            echo "Login response did not include a token."
            exit 1
          fi

          echo "::add-mask::${token}"
          echo "ECW_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Select board type
        id: board
        run: |
          set -euo pipefail

          mkdir -p artifacts

          board_types_response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ECW_TOKEN}" \
            "${ECW_BACKEND_URL%/}/board_types?page_no=1&page_size=100")"

          echo "${board_types_response}" > artifacts/board-types.json

          python3 - "${BOARD_SEARCH}" <<'PY'
          import json
          import os
          import sys

          search = sys.argv[1].lower()

          with open("artifacts/board-types.json", encoding="utf-8") as board_types_file:
              board_types = json.load(board_types_file)

          if isinstance(board_types, dict):
              board_types = (
                  board_types.get("items")
                  or board_types.get("board_types")
                  or board_types.get("results")
                  or board_types.get("data")
                  or []
              )

          matches = [
              board_type
              for board_type in board_types
              if search in str(board_type.get("board_name", "")).lower()
          ]

          if not matches:
              raise SystemExit(f"No board type found containing '{search}'.")

          selected = matches[0]
          board_name = selected.get("board_name", "")
          if not board_name:
              raise SystemExit("Selected board type did not include board_name.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"board_name={board_name}\n")

          print(f"Selected board type: {board_name} (id: {selected.get('id')})")
          PY

      - name: Create auto booking
        id: booking
        run: |
          set -euo pipefail

          booking_response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${ECW_TOKEN}" \
            --get \
            --data-urlencode "board_name=${{ steps.board.outputs.board_name }}" \
            "${ECW_BACKEND_URL%/}/auto-bookings")"

          echo "${booking_response}" > artifacts/booking.json

          python3 <<'PY'
          import json
          import os

          with open("artifacts/booking.json", encoding="utf-8") as booking_file:
              booking = json.load(booking_file)

          booking_id = booking.get("id")
          if not booking_id:
              raise SystemExit("Booking response is missing id.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"booking_id={booking_id}\n")

          print(f"Created booking: {booking_id}")
          PY

      - name: Upload reserve artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecw-ci-reserve-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn

  wait:
    name: "2. Wait: booking becomes active"
    runs-on: self-hosted
    needs: reserve

    env:
      ECW_EMAIL: ${{ secrets.ECW_EMAIL }}
      ECW_PASSWORD: ${{ secrets.ECW_PASSWORD }}
      ECW_BOOKING_ID: ${{ needs.reserve.outputs.booking_id }}

    steps:
      - name: Login and store token
        run: |
          set -euo pipefail

          login_response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"${ECW_EMAIL}\",\"password\":\"${ECW_PASSWORD}\"}" \
            "${ECW_BACKEND_URL%/}/auth/jwt/login")"

          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))' <<<"${login_response}")"

          if [ -z "${token}" ]; then
            echo "Login response did not include a token."
            exit 1
          fi

          echo "::add-mask::${token}"
          echo "ECW_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Wait for booking to become active
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          backend_url = os.environ["ECW_BACKEND_URL"].rstrip("/")
          token = os.environ["ECW_TOKEN"]
          booking_id = os.environ["ECW_BOOKING_ID"]
          timeout_seconds = int(os.environ["BOOKING_WAIT_TIMEOUT_SECONDS"])

          def parse_datetime(value: str) -> datetime:
              if value.endswith("Z"):
                  value = value[:-1] + "+00:00"
              parsed = datetime.fromisoformat(value)
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          def get_booking() -> dict:
              query = urllib.parse.urlencode({"booking_id": booking_id})
              request = urllib.request.Request(
                  f"{backend_url}/booking?{query}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.loads(response.read().decode("utf-8"))

          deadline = time.monotonic() + timeout_seconds
          print(f"Waiting for booking {booking_id} to become active...")

          while True:
              booking = get_booking()
              start = parse_datetime(booking["start_utc"])
              end = parse_datetime(booking["end_utc"])
              status = str(booking.get("status", "")).lower()
              now = datetime.now(timezone.utc)

              active = start <= now < end and status in {"active", "confirmed"}
              if active:
                  print(f"Booking {booking_id} is active.")
                  break

              if now >= end:
                  raise SystemExit(f"Booking {booking_id} ended before it became active.")
              if time.monotonic() > deadline:
                  raise SystemExit(
                      f"Booking {booking_id} did not become active within "
                      f"{timeout_seconds} seconds."
                  )

              wait_seconds = min(max((start - now).total_seconds() + 0.5, 1), 5)
              print(
                  f"Booking status={status}, starts={start.isoformat()}, "
                  f"waiting {wait_seconds:.1f}s..."
              )
              time.sleep(wait_seconds)
          PY

  test:
    name: "3. Test: run wait, serial, and camera CI jobs"
    runs-on: self-hosted
    needs: [reserve, wait]

    env:
      ECW_EMAIL: ${{ secrets.ECW_EMAIL }}
      ECW_PASSWORD: ${{ secrets.ECW_PASSWORD }}
      ECW_BOOKING_ID: ${{ needs.reserve.outputs.booking_id }}
      ECW_BOARD_NAME: ${{ needs.reserve.outputs.board_name }}

    steps:
      - name: Login and store token
        run: |
          set -euo pipefail

          login_response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"email\":\"${ECW_EMAIL}\",\"password\":\"${ECW_PASSWORD}\"}" \
            "${ECW_BACKEND_URL%/}/auth/jwt/login")"

          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("token", ""))' <<<"${login_response}")"

          if [ -z "${token}" ]; then
            echo "Login response did not include a token."
            exit 1
          fi

          echo "::add-mask::${token}"
          echo "ECW_TOKEN=${token}" >> "${GITHUB_ENV}"

      - name: Create wait, serial, and camera CI jobs
        run: |
          set -euo pipefail

          mkdir -p artifacts

          python3 <<'PY'
          import json
          import os
          import urllib.request

          backend_url = os.environ["ECW_BACKEND_URL"].rstrip("/")
          token = os.environ["ECW_TOKEN"]
          booking_id = int(os.environ["ECW_BOOKING_ID"])

          # Registry keys from _COMMAND_REGISTRY in api/ci_jobs.py -- these are
          # the only public command names the API accepts. There is no nested
          # do/wait/expect/on_failure schema; commands are flat and keyed by
          # name.
          job_specs = {
              "wait": {
                  "request_id": "gha-wait-001",
                  "name": "GitHub Actions wait job",
                  "duration_seconds": 15,
                  "commands": [
                      {
                          "id": "wait-10s",
                          "name": "Wait 10 seconds",
                          "command": "delay",
                          "attempts": 1,
                          "timeout_ms": 10000,
                      }
                  ],
              },
              "serial": {
                  "request_id": "gha-serial-001",
                  "name": "GitHub Actions serial job",
                  "duration_seconds": 10,
                  "commands": [
                      {
                          "id": "mcu-serial",
                          "name": "MCU serial capture",
                          "command": "mcu.serial_log",
                          "attempts": 1,
                          "timeout_ms": 2000,
                          "parameters": {"filename": "gha-mcu.log"},
                      },
                      {
                          "id": "mpu-serial",
                          "name": "MPU serial capture",
                          "command": "mpu.serial_log",
                          "attempts": 1,
                          "timeout_ms": 2000,
                          "parameters": {"filename": "gha-mpu.log"},
                      },
                  ],
              },
              "camera": {
                  "request_id": "gha-camera-001",
                  "name": "GitHub Actions camera job",
                  "duration_seconds": 10,
                  "commands": [
                      {
                          "id": "camera-shot",
                          "name": "Capture camera screenshot",
                          "command": "camera.screenshot",
                          "attempts": 1,
                          "timeout_ms": 5000,
                          "parameters": {"filename": "gha-frame.jpg"},
                      }
                  ],
              },
          }

          job_ids = {}
          for label, spec in job_specs.items():
              payload = {"booking_id": booking_id, **spec}
              request = urllib.request.Request(
                  f"{backend_url}/v1/ci/jobs",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  job = json.loads(response.read().decode("utf-8"))

              with open(
                  f"artifacts/ci-job-{label}-created.json", "w", encoding="utf-8"
              ) as job_file:
                  json.dump(job, job_file, indent=2)
                  job_file.write("\n")

              job_id = job.get("id")
              if not job_id:
                  raise SystemExit(f"{label} job creation response is missing id.")

              job_ids[label] = job_id
              print(f"Created {label} CI job: {job_id}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"ECW_CI_JOB_IDS={json.dumps(job_ids)}\n")
          PY

      - name: Poll CI jobs and report results
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          backend_url = os.environ["ECW_BACKEND_URL"].rstrip("/")
          token = os.environ["ECW_TOKEN"]
          job_ids = json.loads(os.environ["ECW_CI_JOB_IDS"])
          timeout_seconds = int(os.environ["JOB_WAIT_TIMEOUT_SECONDS"])
          artifact_dir = Path("artifacts")

          # Real terminal statuses from JobStatus in api/ci_jobs.py -- there is
          # no "passed" value, jobs that finish successfully report
          # "succeeded".
          TERMINAL_STATUSES = {"succeeded", "failed", "cancelled", "invalid"}

          def get_json(path: str) -> dict:
              request = urllib.request.Request(
                  f"{backend_url}{path}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  return json.loads(response.read().decode("utf-8"))

          summary_lines = ["# ECW CI Job Smoke Result", ""]
          any_failed = False

          for label, job_id in job_ids.items():
              deadline = time.monotonic() + timeout_seconds
              final_job = None

              while True:
                  job = get_json(f"/v1/ci/jobs/{job_id}")
                  status = str(job.get("status", "")).lower()
                  print(f"{label} CI job {job_id} status: {status}")

                  if status in TERMINAL_STATUSES:
                      final_job = job
                      break

                  if time.monotonic() > deadline:
                      final_job = job
                      status = "timeout"
                      print(f"{label} CI job {job_id} did not finish within {timeout_seconds}s.")
                      break

                  time.sleep(2)

              logs = get_json(f"/v1/ci/jobs/{job_id}/logs")
              results = get_json(f"/v1/ci/jobs/{job_id}/results")

              (artifact_dir / f"ci-job-{label}-final.json").write_text(
                  json.dumps(final_job, indent=2) + "\n",
                  encoding="utf-8",
              )
              (artifact_dir / f"ci-job-{label}-logs.json").write_text(
                  json.dumps(logs, indent=2) + "\n",
                  encoding="utf-8",
              )
              (artifact_dir / f"ci-job-{label}-results.json").write_text(
                  json.dumps(results, indent=2) + "\n",
                  encoding="utf-8",
              )

              final_status = str(final_job.get("status", "timeout")).lower()
              summary_lines.append(f"- {label} job {job_id}: {final_status}")
              if final_status != "succeeded":
                  any_failed = True
                  print(f"FAIL: {label} CI job {job_id} finished with status {final_status}.")
              else:
                  print(f"PASS: {label} CI job {job_id} succeeded.")

          summary_lines.extend(
              [
                  "",
                  f"- Booking ID: {os.environ.get('ECW_BOOKING_ID', '')}",
                  f"- Board: {os.environ.get('ECW_BOARD_NAME', '')}",
                  "",
              ]
          )
          (artifact_dir / "ci-job-summary.md").write_text(
              "\n".join(summary_lines),
              encoding="utf-8",
          )

          if any_failed:
              raise SystemExit(1)
          PY

      - name: End reservation
        if: always()
        run: |
          set -euo pipefail

          if [ -z "${ECW_BOOKING_ID:-}" ] || [ -z "${ECW_TOKEN:-}" ]; then
            echo "No booking/token available; skipping reservation cleanup."
            exit 0
          fi

          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ECW_TOKEN}" \
            --get \
            --data-urlencode "booking_id=${ECW_BOOKING_ID}" \
            "${ECW_BACKEND_URL%/}/cancel-booking"

      - name: Upload CI job artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecw-ci-job-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
