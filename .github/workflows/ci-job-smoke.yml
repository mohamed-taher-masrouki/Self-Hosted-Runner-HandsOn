name: Stage 1 - Build & Reserve

# Session-trigger demo, 1 of 2.
#
# You start this manually. It builds the firmware, reserves a board, and
# registers a session-activation trigger with ECW -- then STOPS. No runner
# sits polling booking status.
#
# When ECW activates the booked session it fires "Stage 2 - Active Session"
# (ci-job-active.yml) via the workflow_dispatch REST API, passing the booking
# context as inputs.

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: ECW backend base URL reachable from the self-hosted runner
        required: true
        default: http://localhost:8002
      board_search:
        description: Board name text to search before auto-booking
        required: true
        default: STM32 DK
      active_ref:
        description: >-
          Git ref Stage 2 should check out / run on. Defaults to the ref that
          started this run.
        required: false
        default: ""

env:
  ECW_BACKEND_URL: ${{ inputs.backend_url }}
  BOARD_SEARCH: ${{ inputs.board_search }}
  FQBN: arduino:renesas_uno:unor4wifi
  ARDUINO_CORE: arduino:renesas_uno
  FIRMWARE_SKETCH: firmware/led_value

jobs:
  build:
    name: Build firmware
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          set -euo pipefail

          if ! command -v arduino-cli >/dev/null 2>&1; then
            mkdir -p "$HOME/bin"
            curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          fi
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install Arduino core
        run: |
          set -euo pipefail

          arduino-cli core update-index
          arduino-cli core install "${ARDUINO_CORE}"

      - name: Install Arduino libraries
        run: |
          set -euo pipefail

          # ArduinoGraphics renders the text on the onboard LED matrix; unlike
          # Arduino_LED_Matrix it isn't bundled with the core.
          arduino-cli lib update-index
          arduino-cli lib install "ArduinoGraphics"

      - name: Compile firmware
        run: |
          set -euo pipefail

          mkdir -p build
          arduino-cli compile --fqbn "${FQBN}" "${FIRMWARE_SKETCH}" --output-dir build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecw-firmware-${{ github.run_id }}
          path: build/led_value.ino.bin

  reserve:
    name: Reserve board & register trigger
    runs-on: self-hosted
    needs: build
    outputs:
      booking_id: ${{ steps.booking.outputs.booking_id }}
      board_name: ${{ steps.board.outputs.board_name }}

    env:
      ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
      ECW_DISPATCH_PAT: ${{ secrets.ECW_DISPATCH_PAT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          set -euo pipefail

          if [ -z "${ECW_API_KEY}" ]; then
            echo "Missing ECW_API_KEY repository secret."
            exit 1
          fi
          if [ -z "${ECW_DISPATCH_PAT}" ]; then
            echo "Missing ECW_DISPATCH_PAT repository secret (fine-grained PAT, Actions: Read and write)."
            exit 1
          fi

      - name: Check backend health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "${ECW_BACKEND_URL%/}/docs" \
            --output /dev/null

      - name: Select board type
        id: board
        run: python3 .github/scripts/select_board.py

      - name: Find or create booking
        id: booking
        env:
          ECW_BOARD_NAME: ${{ steps.board.outputs.board_name }}
        run: python3 .github/scripts/find_or_create_booking.py

      - name: Register session-activation trigger
        env:
          ECW_BOOKING_ID: ${{ steps.booking.outputs.booking_id }}
          ECW_ACTIVE_WORKFLOW: ci-job-active.yml
          ECW_ACTIVE_REF: ${{ inputs.active_ref }}
        run: python3 .github/scripts/register_activation_trigger.py

      - name: Upload reserve artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecw-ci-reserve-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
